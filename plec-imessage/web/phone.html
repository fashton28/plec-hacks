<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#FBE0D4">
  <title>PLEC · Group Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23E4543F'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="phone.css">
</head>
<body class="phone-page">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>

  <!-- Desktop only: brand + link to the brain -->
  <header class="corner">
    <svg class="logo" viewBox="0 0 132 48" height="40" role="img" aria-label="plec">
      <polygon points="24.1,16.9 22.9,2.9 17.8,3.8 21.5,17.3" fill="var(--c-violet)"/><polygon points="20.0,18.1 13.1,9.4 9.4,13.1 18.1,20.0" fill="var(--c-blue)"/><polygon points="17.4,21.3 4.0,17.1 2.9,22.2 16.9,23.8" fill="var(--c-green)"/><polygon points="16.9,24.9 6.1,27.1 7.7,32.0 17.7,27.4" fill="var(--c-yellow)"/><polygon points="18.2,28.1 7.5,37.3 11.3,40.9 20.1,29.9" fill="var(--c-orange)"/><polygon points="21.0,30.5 17.1,40.8 22.2,42.1 23.6,31.1" fill="var(--c-red)"/>
      <text x="27" y="35" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-weight="800" font-size="36" letter-spacing="-1.6" fill="var(--coral)">plec</text>
    </svg>
    <span class="corner-tag">Group chat view</span>
  </header>
  <a class="view-link corner-link" href="index.html">← PLEC's brain</a>

  <main class="device-wrap">
    <div class="device" id="device">
      <div class="phone">
        <div class="screen">
          <div class="sky-top"></div>
          <div class="island fake"></div>
          <div class="statusbar fake">
            <span id="clock">9:41</span>
            <span class="icons">
              <svg width="18" height="12" viewBox="0 0 18 12" fill="#111"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
              <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="#111" stroke-width="1.8" stroke-linecap="round"><path d="M1.5 4.5a9.5 9.5 0 0 1 13 0"/><path d="M4 7.3a6 6 0 0 1 8 0"/><circle cx="8" cy="10" r="1" fill="#111"/></svg>
              <svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x=".5" y=".5" width="23" height="12" rx="3.5" stroke="#111" opacity=".4"/><rect x="2" y="2" width="18" height="9" rx="2" fill="#111"/><path d="M25 4.5v4" stroke="#111" stroke-width="1.5" stroke-linecap="round" opacity=".5"/></svg>
            </span>
          </div>

          <div class="chat-head">
            <a class="round-btn" href="index.html" aria-label="Open PLEC's brain"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
            <div class="stack" id="head-stack"></div>
            <div class="head-text"><b id="chat-title">Group chat</b><span id="chat-sub"><i class="dot"></i>PLEC is here</span></div>
            <div class="controls compact" id="controls-head"></div>
          </div>

          <div class="chat" id="chat">
            <div class="today" id="today">Today</div>
            <div id="msgs"></div>
            <div id="typing"></div>
          </div>
          <button class="jump" id="jump" type="button">New messages ↓</button>

          <div class="foot">
            <div class="composer" aria-hidden="true">
              <span class="round-btn plus"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
              <span class="ph">Message the group</span>
              <span class="send"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></span>
            </div>
            <div class="home fake"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="below"><div class="controls" id="controls"></div></div>
  </main>

<script src="demo.js"></script>
<script src="shared.js"></script>
<script src="phone.js"></script>
</body>
</html>
